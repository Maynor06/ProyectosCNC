services:

  mongo:
    image: mongo:7
    container_name: cnc_mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./cncBackend
    container_name: cnc_backend
    restart: always
    depends_on:
      - mongo
    env_file:
    - ./cncBackend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: cnc_db
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./generated:/app/generated

  frontend:
    build: ./cncFrontend
    container_name: cnc_frontend
    restart: always

  nginx:
    image: nginx:latest
    container_name: cnc_nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./cncFrontend/dist:/usr/share/nginx/html

volumes:
  mongo_data:
